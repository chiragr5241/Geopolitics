<!DOCTYPE html>
<html lang="en" class="light-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Story tracker — chronological update timelines for stories you've marked important">
  <title>Timelines | OSINT Daily</title>

  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.remove('light-mode');}catch(e){}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=18">
</head>
<body>

<div id="site-nav-mount"></div>

<div class="page-wrap">
  <div class="page-head">
    <div class="page-title">Story Timelines</div>
    <div class="page-sub">Stories you've marked important, with every update since.</div>
  </div>

  <div class="tracker-toolbar">
    <button class="tracker-btn primary" id="manage-toggle-btn">Manage stories</button>
    <button class="tracker-btn" id="export-watchlist-btn">Export watchlist.json</button>
    <span class="tracker-toolbar-note">Your selection is saved on this device automatically. Export to commit it to the repo.</span>
  </div>

  <div class="manage-panel" id="manage-panel" hidden></div>

  <div class="tracker-layout">
    <div class="tracker-rail" id="tracker-rail"></div>
    <div class="tracker-main" id="tracker-main"></div>
  </div>
</div>

<script src="js/nav.js?v=16"></script>
<script src="js/reveal.js?v=16"></script>
<script src="js/util.js?v=17"></script>
<script src="js/config.js?v=16"></script>
<script src="js/data.js?v=16"></script>
<script src="js/watchlist.js?v=18"></script>
<script src="js/feed-item.js?v=18"></script>
<script src="js/tracker.js?v=20"></script>
</body>
</html>
