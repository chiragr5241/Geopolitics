# One-server deployment: Neo4j Community + the read API + Caddy (automatic HTTPS).
# See NEO4J.md §4 for the steps. On the server, next to this file, create .env with:
#
#   NEO4J_PASSWORD=<long random string>
#   API_DOMAIN=api.example.com          # DNS A record → this server
#   API_CORS_ORIGINS=                   # extra page origins, comma-separated (GitHub Pages is built in)
#
# then:  docker compose up -d --build
#
# Neo4j's Bolt port is published on the server's localhost only. Load data from
# your machine through an SSH tunnel (NEO4J.md §4), never by opening 7687.

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_db_logs_query_enabled: "OFF"
      NEO4J_db_tx__log_rotation_retention__policy: "2 files"
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    command: caddy reverse-proxy --from ${API_DOMAIN:?set API_DOMAIN in .env} --to api:8787
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j-data:
  caddy-data:
